name: macOS Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run unit tests
        run: |
          xcodebuild \
            -scheme Notebook \
            -project Notebook.xcodeproj \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:NotebookTests \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Run isolated UI smoke test
        run: |
          xcodebuild \
            -scheme Notebook \
            -project Notebook.xcodeproj \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:NotebookUITests/NotebookUITests/testAppLaunchesWithIsolatedEmptyLibrary \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            test
      - name: Build Release configuration
        run: |
          xcodebuild \
            -scheme Notebook \
            -project Notebook.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
