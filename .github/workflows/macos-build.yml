name: macOS Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build for testing
        run: xcodebuild -scheme Notebook -project Notebook.xcodeproj -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build-for-testing
