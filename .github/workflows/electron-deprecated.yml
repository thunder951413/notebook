name: Electron (deprecated)

# The Electron shell is deprecated (see docs/DESKTOP_TAURI_2026-10-13.md).
# It is no longer packaged on every push: run this workflow manually, or push
# a legacy `v*` tag, when an Electron build is needed as a fallback. The
# default desktop artifact is the Tauri app (cross-platform.yml /
# desktop-tauri.yml).

permissions:
  contents: write

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Notebook Next $GITHUB_REF_NAME" --notes 'macOS 构建未签名、未公证。核对 SHA-256 后，可对解压出的应用执行：xattr -rc "/Applications/notebook-next.app"'
          fi

  desktop-package:
    needs: [prepare-release]
    if: ${{ always() && (!startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm, cache-dependency-path: cross-platform/pnpm-lock.yaml }
      - name: Install dependencies
        working-directory: cross-platform
        run: pnpm install --frozen-lockfile
      - name: Package desktop application
        shell: bash
        working-directory: cross-platform
        env:
          # This project intentionally distributes unsigned desktop artifacts.
          # macOS users clear quarantine locally with `xattr -rc`; do not let a
          # runner identity or stale signing secret make release output vary.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SKIP_NOTARIZE: 'true'
        run: |
          pnpm --filter @notebook/desktop dist
      - name: Verify release artifact contract
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: cross-platform/apps/desktop
        run: |
          case "${{ matrix.os }}" in
            macos-latest)
              find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*-mac.zip' \) -print -quit | grep -q .
              ;;
            windows-latest)
              find release -maxdepth 1 -type f -name '*.exe' -print -quit | grep -q .
              ;;
            ubuntu-latest)
              find release -maxdepth 1 -type f -name '*.AppImage' -print -quit | grep -q .
              ;;
          esac
      - name: Upload files directly to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: cross-platform/apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # electron-builder 26 writes artifacts with the product name as-is
          # ("Notebook Next Setup ..."), but emits latest-*.yml URLs using the
          # hyphen-normalized form. GitHub also rewrites spaces in asset names,
          # so upload under the hyphenated name to keep assets and metadata in
          # sync; otherwise the in-app updater would 404 on the yml URL.
          files=()
          while IFS= read -r -d '' file; do
            renamed="$(dirname "$file")/$(basename "$file" | tr ' ' '-')"
            if [ "$renamed" != "$file" ]; then mv "$file" "$renamed"; fi
            files+=("$renamed")
          done < <(find release -maxdepth 1 -type f ! -name 'builder-*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files were produced" >&2
            exit 1
          fi
          checksum_file="release/SHA256SUMS-${{ matrix.os }}.txt"
          : > "$checksum_file"
          for file in "${files[@]}"; do
            filename="$(basename "$file")"
            if command -v sha256sum >/dev/null 2>&1; then
              (cd release && sha256sum "$filename") >> "$checksum_file"
            else
              (cd release && shasum -a 256 "$filename") >> "$checksum_file"
            fi
          done
          files+=("$checksum_file")
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop-package
    runs-on: ubuntu-latest
    steps:
      - name: Publish only after every platform artifact succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
