name: macOS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      KEYCHAIN_PATH: ${{ runner.temp }}/notebook-signing.keychain-db
      ARCHIVE_PATH: ${{ runner.temp }}/Notebook.xcarchive
      APP_PATH: ${{ runner.temp }}/Notebook.xcarchive/Products/Applications/Notebook.app
      NOTARY_PROFILE: notebook-notary
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify release secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing required secret: $name"; exit 1; }
          done

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/notebook-signing.p12"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Run unit tests
        run: |
          xcodebuild \
            -scheme Notebook \
            -project Notebook.xcodeproj \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:NotebookTests \
            test

      - name: Run isolated UI smoke test
        run: |
          xcodebuild \
            -scheme Notebook \
            -project Notebook.xcodeproj \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:NotebookUITests/NotebookUITests/testAppLaunchesWithIsolatedEmptyLibrary \
            test

      - name: Archive signed Release app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -scheme Notebook \
            -project Notebook.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Developer ID Application' \
            archive
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SUBMISSION_ZIP="$RUNNER_TEMP/Notebook-notarization.zip"
          ditto -c -k --keepParent "$APP_PATH" "$SUBMISSION_ZIP"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool submit "$SUBMISSION_ZIP" --keychain-profile "$NOTARY_PROFILE" --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Package notarized app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "Notebook-${{ github.ref_name }}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Notebook-${{ github.ref_name }}.zip
          generate_release_notes: true

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
