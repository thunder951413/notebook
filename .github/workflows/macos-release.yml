name: macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      NOTARY_PROFILE: notebook-notary
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Configure temporary paths
        run: |
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/notebook-signing.keychain-db" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/Notebook.xcarchive" >> "$GITHUB_ENV"
          echo "APP_PATH=$RUNNER_TEMP/Notebook.xcarchive/Products/Applications/Notebook.app" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${{ inputs.release_tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Select release signing mode
        id: release_mode
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if test -z "${!name}"; then
              echo "Missing optional signing secret: $name"
              missing=1
            fi
          done
          if test "$missing" -eq 0; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "RELEASE_ASSET=Notebook-${{ inputs.release_tag || github.ref_name }}.zip" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "RELEASE_ASSET=Notebook-${{ inputs.release_tag || github.ref_name }}-adhoc.zip" >> "$GITHUB_ENV"
            echo "::warning::Apple signing secrets are incomplete; publishing an ad-hoc signed build without notarization."
          fi

      - name: Import Developer ID certificate
        if: steps.release_mode.outputs.signed == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/notebook-signing.p12"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Run unit tests
        run: |
          xcodebuild \
            -scheme Notebook \
            -project Notebook.xcodeproj \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:NotebookTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Run isolated UI smoke test
        run: |
          xcodebuild \
            -scheme Notebook \
            -project Notebook.xcodeproj \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:NotebookUITests/NotebookUITests/testAppLaunchesWithIsolatedEmptyLibrary \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            test

      - name: Archive signed Release app
        if: steps.release_mode.outputs.signed == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -scheme Notebook \
            -project Notebook.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Developer ID Application' \
            archive
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Archive ad-hoc Release app
        if: steps.release_mode.outputs.signed != 'true'
        run: |
          xcodebuild \
            -scheme Notebook \
            -project Notebook.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple
        if: steps.release_mode.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SUBMISSION_ZIP="$RUNNER_TEMP/Notebook-notarization.zip"
          ditto -c -k --keepParent "$APP_PATH" "$SUBMISSION_ZIP"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool submit "$SUBMISSION_ZIP" --keychain-profile "$NOTARY_PROFILE" --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Package Release app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RELEASE_ASSET"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.RELEASE_ASSET }}
          generate_release_notes: true

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
