name: Notebook Next CI

# Default pipeline: quality gates for the shared code, the Rust sync and
# automation crates (with the cross-client fixtures), and the Tauri app as the
# default desktop artifact. Electron packaging moved to electron-deprecated.yml.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['cross-platform/**', 'SyncContractFixtures/**', '.github/workflows/cross-platform.yml']
  pull_request:
    branches: [main]
    paths: ['cross-platform/**', 'SyncContractFixtures/**', '.github/workflows/cross-platform.yml']
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm, cache-dependency-path: cross-platform/pnpm-lock.yaml }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip, cache-dependency-path: cross-platform/services/ai/pyproject.toml }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "cross-platform/crates/notebook-sync\ncross-platform/crates/notebook-automation" }
      - name: Install dependencies
        working-directory: cross-platform
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test and build
        working-directory: cross-platform
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - name: Rust sync protocol (shared fixtures) and automation API
        working-directory: cross-platform
        run: |
          cargo test --manifest-path crates/notebook-sync/Cargo.toml
          cargo test --manifest-path crates/notebook-automation/Cargo.toml
      - name: Test Python AI service
        working-directory: cross-platform/services/ai
        run: |
          python -m pip install -e '.[test]'
          pytest -q

  tauri-app:
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm, cache-dependency-path: cross-platform/pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: cross-platform/apps/tauri/src-tauri }
      - name: Install dependencies
        working-directory: cross-platform
        run: pnpm install --frozen-lockfile
      - name: Test the Tauri shell
        working-directory: cross-platform/apps/tauri
        run: |
          pnpm test
          pnpm build:web
          (cd src-tauri && cargo test)
      - name: Build Notebook.app
        working-directory: cross-platform/apps/tauri
        run: pnpm exec tauri build --bundles app
      - name: Package
        run: |
          bundle="cross-platform/apps/tauri/src-tauri/target/release/bundle/macos/Notebook.app"
          codesign --force --deep --sign - "$bundle"
          ditto -c -k --keepParent "$bundle" Notebook-macos-arm64.zip
          shasum -a 256 Notebook-macos-arm64.zip | awk '{print $1"  Notebook-macos-arm64.zip"}' > Notebook-macos-arm64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Notebook-macos-arm64-${{ github.sha }}
          path: |
            Notebook-macos-arm64.zip
            Notebook-macos-arm64.zip.sha256
          retention-days: 14
