name: Electron Next

permissions:
  contents: write

on:
  push:
    branches: [next]
    tags: ['v*']
    paths: ['cross-platform/**', '.github/workflows/cross-platform.yml']
  pull_request:
    branches: [next]
    paths: ['cross-platform/**', '.github/workflows/cross-platform.yml']
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm, cache-dependency-path: cross-platform/pnpm-lock.yaml }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip, cache-dependency-path: cross-platform/services/ai/pyproject.toml }
      - name: Install Electron dependencies
        working-directory: cross-platform
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test and build
        working-directory: cross-platform
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - name: Test Python AI service
        working-directory: cross-platform/services/ai
        run: |
          python -m pip install -e '.[test]'
          pytest -q

  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Notebook Next $GITHUB_REF_NAME"

  desktop-package:
    needs: [quality, prepare-release]
    if: ${{ always() && needs.quality.result == 'success' && (!startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm, cache-dependency-path: cross-platform/pnpm-lock.yaml }
      - name: Install dependencies
        working-directory: cross-platform
        run: pnpm install --frozen-lockfile
      - name: Package desktop application
        working-directory: cross-platform
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ startsWith(github.ref, 'refs/tags/v') && ((matrix.os == 'macos-latest' && secrets.MACOS_CSC_LINK != '') || (matrix.os == 'windows-latest' && secrets.WINDOWS_CSC_LINK != '')) && 'true' || 'false' }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MACOS_CSC_LINK || matrix.os == 'windows-latest' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MACOS_CSC_KEY_PASSWORD || matrix.os == 'windows-latest' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @notebook/desktop dist
      - name: Upload files directly to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: cross-platform/apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find release -maxdepth 1 -type f ! -name 'builder-*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files were produced" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
