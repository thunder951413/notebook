packages:
  - apps/*
  - packages/*
  - services/*

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  better-sqlite3: true
  # ssh2 has a complete JavaScript implementation; the optional native CPU
  # feature probe is deliberately disabled for deterministic desktop packages.
  cpu-features: false
  ssh2: false

minimumReleaseAgeExclude:
  - better-sqlite3@13.0.1

overrides:
  # plist@3.1.0 pins an xmldom range with known injection/DoS advisories.
  '@xmldom/xmldom': 0.8.15
  # One ProseMirror view for tiptap and the app: two copies break instanceof
  # checks and carry an XSS advisory below 1.42.3.
  prosemirror-view: 1.42.6
