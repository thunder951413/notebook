[package]
name = "notebook-sync"
version = "0.1.0"
description = "WebDAV v4 journal transport shared by the Notebook desktop shell; no Tauri dependency so it builds and tests on any host."
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["sync", "time"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
roxmltree = "0.20"
regex = "1"
url = "2"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tiny_http = "0.12"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
