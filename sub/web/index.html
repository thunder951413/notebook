<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notebook Server</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="login-screen" class="hidden">
  <form id="login-form" class="login-card">
    <div class="login-logo">📓</div>
    <h1 id="login-title">Notebook Server</h1>
    <p class="muted">此服务器需要密码登录</p>
    <input type="password" id="login-password" placeholder="服务器密码" autocomplete="current-password" required>
    <p id="login-error" class="error hidden"></p>
    <button type="submit" class="btn primary block">登录</button>
  </form>
</div>

<div id="connection-error" class="empty-state hidden" role="alert">无法连接笔记服务器。未保存的本机草稿会保留。<br><button id="btn-reconnect" class="btn">重新连接</button></div>
<div id="app" class="hidden">
  <button id="panel-backdrop" class="panel-backdrop" aria-label="关闭侧栏" hidden></button>
  <aside id="sidebar">
    <div class="sidebar-header">
      <button id="btn-panel-close" class="icon-btn mobile-only" aria-label="关闭导航">✕</button>
      <span id="workspace-name" class="workspace-name">My Notebook</span>
      <div class="sidebar-actions">
        <button id="btn-graph" class="icon-btn" title="知识图谱">🕸</button>
        <button id="btn-settings" class="icon-btn" title="设置">⚙️</button>
      </div>
    </div>
    <div class="search-box">
      <input id="search-input" type="text" placeholder="搜索笔记… ( / )">
      <div id="search-results" class="search-results hidden"></div>
    </div>
    <nav id="quick-nav" class="quick-nav">
      <a href="#/" class="quick-link" data-nav="home">🏠 全部笔记</a>
      <a href="#/favorites" class="quick-link" data-nav="favorites">⭐ 收藏</a>
      <a href="#/tasks" class="quick-link" data-nav="tasks">✅ 任务</a>
      <a href="#/reminders" class="quick-link" data-nav="reminders">🔔 提醒</a>
      <a href="#/trash" class="quick-link" data-nav="trash">🗑 回收站</a>
    </nav>
    <div id="notebooks" class="notebooks"></div>
    <div id="tags-panel" class="tags-panel">
      <div class="panel-title">标签 <button id="btn-add-tag" class="mini-btn" title="新建标签">＋</button></div>
      <div id="tags-list"></div>
    </div>
  </aside>

  <main id="main">
    <div class="workspace-toolbar"><button id="btn-navigation" class="btn" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">☰ 导航</button><span>笔记</span><button id="btn-editor-back" class="btn">返回列表</button></div>
    <div id="list-view" class="list-view hidden">
      <div class="list-header">
        <h2 id="list-title">全部笔记</h2>
        <div class="list-actions">
          <button id="btn-new-page" class="btn primary">＋ 新建笔记</button>
          <button id="btn-import" class="btn">导入</button>
          <button id="btn-export-all" class="btn">导出 Markdown</button>
        </div>
      </div>
      <div id="page-list" class="page-list"></div>
    </div>

    <div id="editor-view" class="hidden">
      <div id="editor-header" class="editor-header">
        <div class="editor-title-row">
          <span id="page-icon" class="page-icon" contenteditable="false">📄</span>
          <input id="page-title-input" type="text" placeholder="无标题页面" autocomplete="off">
          <div class="editor-actions">
            <span id="save-status" class="save-status" role="status" aria-live="polite"></span><button id="btn-save-retry" class="btn small hidden">处理未保存内容</button>
            <button id="btn-favorite" class="icon-btn" title="收藏">☆</button>
            <button id="btn-history" class="btn small" title="版本历史">🕘 历史</button>
            <button id="btn-export-page" class="icon-btn" title="导出此页为 Markdown">⤓</button>
            <button id="btn-page-info" class="btn small" aria-controls="inspector" aria-expanded="false">信息</button>
            <button id="btn-more" class="icon-btn" title="更多操作">⋯</button>
          </div>
        </div>
        <button id="btn-document-details" class="btn small details-toggle">位置、类型与提醒</button>
        <div id="page-meta-row" class="page-meta-row">
          <select id="page-notebook-select" title="笔记本"></select>
          <select id="page-section-select" title="分区"></select>
          <span class="page-kind-toggle">
            <button id="kind-document" class="kind-btn active" title="文档">📄</button>
            <button id="kind-task" class="kind-btn" title="任务">✅</button>
          </span>
          <label class="meta-field">📅 截止 <input type="datetime-local" id="page-due"></label>
          <label class="meta-field">🔔 提醒 <input type="datetime-local" id="page-reminder"></label>
          <select id="page-recurrence" title="重复规则">
            <option value="">不重复</option>
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
          </select>
          <button id="btn-important" class="chip-btn" title="重要">🔥</button>
        </div>
        <div class="editor-tabs">
          <button class="tab active" data-mode="split" id="tab-split">分屏</button>
          <button class="tab" data-mode="edit" id="tab-edit">编辑</button>
          <button class="tab" data-mode="preview" id="tab-preview">预览</button>
          <div class="toolbar">
            <button class="tb" data-cmd="h1" title="标题1">H1</button>
            <button class="tb" data-cmd="h2" title="标题2">H2</button>
            <button class="tb" data-cmd="h3" title="标题3">H3</button>
            <button class="tb" data-cmd="bold" title="加粗 Ctrl+B"><b>B</b></button>
            <button class="tb" data-cmd="italic" title="斜体 Ctrl+I"><i>I</i></button>
            <button class="tb" data-cmd="strike" title="删除线">S̶</button>
            <button class="tb" data-cmd="code" title="行内代码"><code>&lt;&gt;</code></button>
            <button class="tb" data-cmd="quote" title="引用">❝</button>
            <button class="tb" data-cmd="list" title="无序列表">•≡</button>
            <button class="tb" data-cmd="olist" title="有序列表">1≡</button>
            <button class="tb" data-cmd="task" title="任务列表">☑</button>
            <button class="tb" data-cmd="table" title="表格">▦</button>
            <button class="tb" data-cmd="link" title="链接">🔗</button>
            <button class="tb" data-cmd="image" title="插入图片/附件" id="btn-insert-asset">🖼</button>
            <button class="tb" data-cmd="math" title="数学公式">∑</button>
            <button class="tb" data-cmd="hr" title="分隔线">―</button>
            <button class="tb" data-cmd="wikilink" title="链接到笔记 [[...]]">⛓</button>
          </div>
        </div>
      </div>
      <div id="editor-body" class="editor-body">
        <textarea aria-label="笔记正文" id="editor" class="editor-pane" spellcheck="false" placeholder="在此输入 Markdown…"></textarea>
        <div id="preview" class="preview-pane markdown-body"></div>
      </div>
      <div id="editor-statusbar" class="editor-statusbar">
        <span id="stat-words">0 字</span>
        <span id="stat-cursor">行 1, 列 1</span>
        <span class="spacer"></span>
        <span id="stat-links"></span>
        <span id="stat-saved"></span>
      </div>
    </div>

    <div id="tasks-view" class="list-view hidden">
      <div class="list-header">
        <h2 id="tasks-title">任务</h2>
        <div class="list-actions">
          <button class="btn small task-filter active" data-scope="open">进行中</button>
          <button class="btn small task-filter" data-scope="today">今天</button>
          <button class="btn small task-filter" data-scope="overdue">已逾期</button>
          <button class="btn small task-filter" data-scope="upcoming">即将到来</button>
          <button class="btn small task-filter" data-scope="completed">已完成</button>
        </div>
      </div>
      <div id="tasks-list" class="page-list"></div>
    </div>

    <div id="graph-view" class="hidden">
      <div class="graph-toolbar">
        <h2>知识图谱</h2>
        <label class="muted"><input type="checkbox" id="graph-show-links" checked> 显示关联</label>
        <button id="btn-graph-back" class="btn small">返回</button>
      </div>
      <svg id="graph-svg" class="graph-svg"></svg>
    </div>
  </main>

  <aside id="inspector" class="hidden">
    <div class="inspector-header">
      <span>页面信息</span>
      <button id="btn-inspector-close" class="icon-btn" aria-label="关闭页面信息">✕</button>
    </div>
    <div class="inspector-body">
      <div class="ins-section">
        <div class="ins-title">标签</div>
        <div id="insp-tags"></div>
        <div class="ins-tag-add">
          <select id="insp-tag-select"></select>
          <button id="btn-add-page-tag" class="mini-btn">＋</button>
        </div>
      </div>
      <div class="ins-section">
        <div class="ins-title">步骤 (任务清单)</div>
        <div id="insp-steps"></div>
        <div class="ins-step-add">
          <input id="insp-step-input" type="text" placeholder="添加步骤…">
          <button id="btn-add-step" class="mini-btn">＋</button>
        </div>
      </div>
      <div class="ins-section">
        <div class="ins-title">资产</div>
        <div id="insp-assets"></div>
        <button id="btn-insp-upload" class="btn small">上传图片/文件</button>
        <input type="file" id="insp-file-input" multiple class="hidden">
      </div>
      <div class="ins-section">
        <div class="ins-title">链接到此页 (反向链接)</div>
        <div id="insp-backlinks" class="backlinks"></div>
      </div>
      <div class="ins-section">
        <div class="ins-title">评论</div>
        <div id="insp-comments"></div>
        <div class="ins-comment-add">
          <input id="insp-comment-author" type="text" placeholder="昵称" value="我">
          <input id="insp-comment-body" type="text" placeholder="写评论…">
          <button id="btn-add-comment" class="mini-btn">＋</button>
        </div>
      </div>
    </div>
  </aside>
</div>

<!-- modals -->
<div id="modal-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>

<input type="file" id="asset-file-input" multiple class="hidden">
<input type="file" id="backup-file-input" accept=".zip" class="hidden">
<input type="file" id="import-file-input" multiple accept=".md,.markdown,.txt,.zip" class="hidden">

<script type="module" src="js/api.js"></script>
<script type="module" src="js/markdown.js"></script>
<script type="module" src="js/diff.js"></script>
<script type="module" src="js/graph.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
